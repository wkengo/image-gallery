<!doctype html>
<html lang="ja">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>便利機能の紹介ページ</title>

<style>

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  font-family:
    "Meiryo UI",
    Meiryo,
    sans-serif;
  color: #172033;
  background: #f5f7fb;
}


/* ============================================================
   ヘッダー
============================================================ */

.hero {
  padding: 32px 40px 30px;
  color: #fff;
  background:
    linear-gradient(
      110deg,
      #061852 0%,
      #17104f 55%,
      #41004c 100%
    );
}

.hero-inner {
  max-width: 1800px;
  margin: 0 auto;
}

.hero h1 {
  margin: 0 0 16px;
  font-size: 34px;
  line-height: 1.3;
  font-weight: 700;
}

.hero p {
  margin: 0;
  font-size: 15px;
  line-height: 1.8;
}


/* ============================================================
   操作部分
============================================================ */

.controls {
  background: #fff;
  border-bottom: 1px solid #dce2ec;
}

.controls-inner {
  max-width: 1800px;
  margin: 0 auto;
  padding: 24px 40px 18px;
}

.search-row {
  display: flex;
  align-items: center;
  gap: 12px;
}

.search-box {
  width: min(500px, 100%);
  height: 46px;
  padding: 0 16px;
  border: 1px solid #cbd3df;
  border-radius: 9px;
  background: #fff;
  font-family: inherit;
  font-size: 15px;
  outline: none;
}

.search-box:focus {
  border-color: #315ec8;
  box-shadow:
    0 0 0 3px
    rgba(49,94,200,.12);
}

.clear-button {
  height: 46px;
  padding: 0 18px;
  border: 1px solid #cbd3df;
  border-radius: 9px;
  background: #fff;
  font-family: inherit;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
}

.clear-button:hover {
  background: #f4f6fa;
}

.count {
  margin-left: 4px;
  color: #647086;
  font-size: 14px;
}


/* ============================================================
   カテゴリボタン
============================================================ */

.category-row {
  display: flex;
  flex-wrap: wrap;
  gap: 9px;
  margin-top: 20px;
  padding-top: 18px;
  border-top: 1px solid #e3e7ee;
}

.category-button {
  padding: 9px 17px;
  border: 0;
  border-radius: 999px;
  background: #e9eefc;
  color: #234b9c;
  font-family: inherit;
  font-size: 14px;
  cursor: pointer;
}

.category-button:hover {
  background: #dce6ff;
}

.category-button.active {
  background: #173f96;
  color: #fff;
}


/* ============================================================
   メイン
============================================================ */

main {
  max-width: 1800px;
  margin: 0 auto;
  padding: 24px 40px 60px;
}


/* ============================================================
   カテゴリセクション
============================================================ */

.category-section {
  margin-bottom: 36px;
}

.category-heading {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 0 0 14px;
  padding-bottom: 10px;
  border-bottom: 2px solid #d6deeb;
}

.category-title {
  margin: 0;
  color: #111827;
  font-size: 24px;
  font-weight: 700;
}

.category-count {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 38px;
  height: 27px;
  padding: 0 10px;
  border-radius: 999px;
  background: #e8eefc;
  color: #173f96;
  font-size: 13px;
  font-weight: 700;
}


/* ============================================================
   カード一覧
============================================================ */

.gallery-grid {
  display: grid;
  grid-template-columns:
    repeat(
      auto-fill,
      minmax(260px, 1fr)
    );
  gap: 18px;
}


/* ============================================================
   カード
============================================================ */

.card {
  display: flex;
  flex-direction: column;
  min-width: 0;
  padding: 0;
  overflow: hidden;
  border: 1px solid #d9e0ea;
  border-radius: 13px;
  background: #fff;
  box-shadow:
    0 2px 8px
    rgba(20,35,70,.06);
  font-family: inherit;
  text-align: left;
  cursor: pointer;
  transition:
    transform .15s ease,
    box-shadow .15s ease;
}

.card:hover {
  transform: translateY(-2px);
  box-shadow:
    0 7px 20px
    rgba(20,35,70,.12);
}

.image-area {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 310px;
  padding: 12px;
  background: #fff;
}

.image-area img {
  display: block;
  max-width: 100%;
  max-height: 100%;
  width: auto;
  height: auto;
  object-fit: contain;
}

.card-title {
  min-height: 58px;
  padding: 14px 15px 16px;
  border-top: 1px solid #edf0f5;
  color: #111827;
  font-size: 16px;
  line-height: 1.45;
  font-weight: 700;
  overflow-wrap: anywhere;
}


/* ============================================================
   0件
============================================================ */

.empty {
  padding: 50px 10px;
  color: #667085;
  font-size: 15px;
  text-align: center;
}


/* ============================================================
   拡大ビュー
============================================================ */

.modal {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 1000;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background:
    rgba(5,10,25,.92);
}

.modal.open {
  display: flex;
}

.modal-image {
  max-width: calc(100vw - 40px);
  max-height: calc(100vh - 40px);
  object-fit: contain;
}

.modal-close {
  position: fixed;
  top: 15px;
  right: 20px;
  width: 46px;
  height: 46px;
  padding: 0;
  border: 1px solid rgba(255,255,255,.4);
  border-radius: 50%;
  background: rgba(0,0,0,.45);
  color: #fff;
  font-family: Arial,sans-serif;
  font-size: 30px;
  line-height: 42px;
  cursor: pointer;
}


/* ============================================================
   スマートフォン
============================================================ */

@media (
  max-width: 700px
) {

  .hero {
    padding:
      22px 16px;
  }

  .hero h1 {
    font-size: 25px;
  }

  .hero p {
    font-size: 13px;
  }

  .controls-inner {
    padding:
      16px;
  }

  .search-row {
    flex-wrap: wrap;
  }

  .search-box {
    flex: 1 1 100%;
    width: 100%;
  }

  .count {
    margin-left: 0;
  }

  main {
    padding:
      18px 12px
      40px;
  }

  .category-title {
    font-size: 20px;
  }

  .gallery-grid {
    grid-template-columns:
      repeat(
        2,
        minmax(0,1fr)
      );
    gap: 10px;
  }

  .image-area {
    height: 230px;
    padding: 7px;
  }

  .card-title {
    min-height: 50px;
    padding: 10px;
    font-size: 13px;
  }

}


@media (
  max-width: 430px
) {

  .gallery-grid {
    grid-template-columns:
      repeat(
        2,
        minmax(0,1fr)
      );
  }

  .image-area {
    height: 200px;
  }

}

</style>

</head>


<body>


<header class="hero">

  <div class="hero-inner">

    <h1>
      便利機能の紹介ページ
    </h1>

    <p>
      画像はクリックで大きく表示できます。
      カテゴリやタイトルから目的の画像を検索できます。
    </p>

  </div>

</header>


<section class="controls">

  <div class="controls-inner">

    <div class="search-row">

      <input
        id="searchBox"
        class="search-box"
        type="search"
        placeholder="タイトル・カテゴリで検索"
      >

      <button
        id="clearButton"
        class="clear-button"
        type="button"
      >
        検索クリア
      </button>

      <div
        id="displayCount"
        class="count"
      ></div>

    </div>


    <div
      id="categoryButtons"
      class="category-row"
    ></div>

  </div>

</section>


<main id="gallery"></main>


<div
  id="modal"
  class="modal"
>

  <button
    id="modalClose"
    class="modal-close"
    type="button"
    aria-label="閉じる"
  >
    ×
  </button>

  <img
    id="modalImage"
    class="modal-image"
    alt=""
  >

</div>


<script>

let galleryData = [];

let selectedCategory =
  'すべて';


const gallery =
  document.getElementById(
    'gallery'
  );

const searchBox =
  document.getElementById(
    'searchBox'
  );

const clearButton =
  document.getElementById(
    'clearButton'
  );

const categoryButtons =
  document.getElementById(
    'categoryButtons'
  );

const displayCount =
  document.getElementById(
    'displayCount'
  );

const modal =
  document.getElementById(
    'modal'
  );

const modalImage =
  document.getElementById(
    'modalImage'
  );

const modalClose =
  document.getElementById(
    'modalClose'
  );


// ------------------------------------------------------------
// カテゴリ一覧
// ------------------------------------------------------------
function getCategories() {

  return [
    ...new Set(
      galleryData.map(
        item =>
          item.category
      )
    )
  ];

}


// ------------------------------------------------------------
// カテゴリ件数
// ------------------------------------------------------------
function getCategoryCount(
  category
) {

  return galleryData.filter(
    item =>
      item.category ===
      category
  ).length;

}


// ------------------------------------------------------------
// カテゴリボタン描画
// ------------------------------------------------------------
function renderCategoryButtons() {

  const categories =
    getCategories();


  categoryButtons.innerHTML =
    '';


  const allButton =
    createCategoryButton(
      'すべて',
      galleryData.length
    );


  categoryButtons.appendChild(
    allButton
  );


  categories.forEach(
    category => {

      categoryButtons.appendChild(
        createCategoryButton(
          category,
          getCategoryCount(
            category
          )
        )
      );

    }
  );

}


// ------------------------------------------------------------
// カテゴリボタン生成
// ------------------------------------------------------------
function createCategoryButton(
  category,
  count
) {

  const button =
    document.createElement(
      'button'
    );


  button.type =
    'button';


  button.className =
    'category-button';


  if (
    selectedCategory ===
    category
  ) {

    button.classList.add(
      'active'
    );

  }


  button.textContent =
    category +
    '（' +
    count +
    '）';


  button.onclick =
    function() {

      selectedCategory =
        category;

      renderCategoryButtons();

      renderGallery();

    };


  return button;
}


// ------------------------------------------------------------
// 現在の絞り込み結果
// ------------------------------------------------------------
function getFilteredItems() {

  const keyword =
    searchBox.value
      .trim()
      .toLowerCase();


  return galleryData.filter(
    item => {

      const categoryOK =
        selectedCategory ===
        'すべて' ||
        item.category ===
        selectedCategory;


      const keywordOK =
        !keyword ||
        item.name
          .toLowerCase()
          .includes(
            keyword
          ) ||
        item.category
          .toLowerCase()
          .includes(
            keyword
          );


      return (
        categoryOK &&
        keywordOK
      );

    }
  );

}


// ------------------------------------------------------------
// ギャラリー描画
// ------------------------------------------------------------
function renderGallery() {

  const filtered =
    getFilteredItems();


  displayCount.textContent =
    '表示数：' +
    filtered.length +
    ' / ' +
    galleryData.length;


  gallery.innerHTML =
    '';


  if (
    filtered.length === 0
  ) {

    const empty =
      document.createElement(
        'div'
      );

    empty.className =
      'empty';

    empty.textContent =
      '該当する画像がありません。';

    gallery.appendChild(
      empty
    );

    return;

  }


  let categories;


  if (
    selectedCategory ===
    'すべて'
  ) {

    categories =
      getCategories().filter(
        category =>
          filtered.some(
            item =>
              item.category ===
              category
          )
      );

  } else {

    categories = [
      selectedCategory
    ];

  }


  categories.forEach(
    category => {

      const items =
        filtered.filter(
          item =>
            item.category ===
            category
        );


      if (
        items.length === 0
      ) {

        return;

      }


      const section =
        document.createElement(
          'section'
        );

      section.className =
        'category-section';


      const heading =
        document.createElement(
          'div'
        );

      heading.className =
        'category-heading';


      const title =
        document.createElement(
          'h2'
        );

      title.className =
        'category-title';

      title.textContent =
        category;


      const count =
        document.createElement(
          'span'
        );

      count.className =
        'category-count';

      count.textContent =
        items.length +
        '件';


      heading.appendChild(
        title
      );

      heading.appendChild(
        count
      );


      const grid =
        document.createElement(
          'div'
        );

      grid.className =
        'gallery-grid';


      items.forEach(
        item => {

          grid.appendChild(
            createCard(
              item
            )
          );

        }
      );


      section.appendChild(
        heading
      );

      section.appendChild(
        grid
      );

      gallery.appendChild(
        section
      );

    }
  );

}


// ------------------------------------------------------------
// カード生成
// ------------------------------------------------------------
function createCard(
  item
) {

  const card =
    document.createElement(
      'button'
    );


  card.type =
    'button';

  card.className =
    'card';


  const imageArea =
    document.createElement(
      'div'
    );

  imageArea.className =
    'image-area';


  const image =
    document.createElement(
      'img'
    );

  image.src =
    item.path;

  image.alt =
    item.name;

  image.loading =
    'lazy';


  const title =
    document.createElement(
      'div'
    );

  title.className =
    'card-title';

  title.textContent =
    item.name;


  imageArea.appendChild(
    image
  );

  card.appendChild(
    imageArea
  );

  card.appendChild(
    title
  );


  card.onclick =
    function() {

      modalImage.src =
        item.path;

      modalImage.alt =
        item.name;

      modal.classList.add(
        'open'
      );

      document.body.style.overflow =
        'hidden';

    };


  return card;
}


// ------------------------------------------------------------
// モーダルを閉じる
// ------------------------------------------------------------
function closeModal() {

  modal.classList.remove(
    'open'
  );

  modalImage.src =
    '';

  document.body.style.overflow =
    '';

}


modalClose.onclick =
  closeModal;


modal.onclick =
  function(event) {

    if (
      event.target ===
      modal
    ) {

      closeModal();

    }

  };


document.addEventListener(
  'keydown',
  function(event) {

    if (
      event.key ===
      'Escape'
    ) {

      closeModal();

    }

  }
);


// ------------------------------------------------------------
// 検索
// ------------------------------------------------------------
searchBox.addEventListener(
  'input',
  function() {

    renderGallery();

  }
);


clearButton.onclick =
  function() {

    searchBox.value =
      '';

    selectedCategory =
      'すべて';

    renderCategoryButtons();

    renderGallery();

    searchBox.focus();

  };


// ------------------------------------------------------------
// gallery.json読込
// ------------------------------------------------------------
fetch(
  'gallery.json?t=' +
  Date.now()
)

.then(
  response => {

    if (
      !response.ok
    ) {

      throw new Error(
        'gallery.json読込失敗'
      );

    }


    return response.json();

  }
)

.then(
  data => {

    galleryData =
      data;


    renderCategoryButtons();

    renderGallery();

  }
)

.catch(
  error => {

    console.error(
      error
    );


    gallery.innerHTML =
      '<div class="empty">' +
      '画像一覧を読み込めませんでした。' +
      '</div>';

  }
);

</script>

</body>

</html>
