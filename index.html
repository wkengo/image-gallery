<!doctype html>
<html lang="ja">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1"
>

<title>便利機能の紹介ページ</title>

<style>

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  font-family:
    "Meiryo UI",
    Meiryo,
    sans-serif;
  color: #172033;
  background: #f5f7fb;
}


/* ============================================================
   ヘッダー
============================================================ */

.hero {
  padding: 32px 40px 30px;
  color: #fff;
  background:
    linear-gradient(
      110deg,
      #061852 0%,
      #17104f 55%,
      #41004c 100%
    );
}

.hero-inner {
  max-width: 1800px;
  margin: 0 auto;
}

.hero h1 {
  margin: 0 0 16px;
  font-size: 34px;
  line-height: 1.3;
  font-weight: 700;
}

.hero p {
  margin: 0;
  font-size: 15px;
  line-height: 1.8;
}


/* ============================================================
   操作部分
============================================================ */

.controls {
  background: #fff;
  border-bottom: 1px solid #dce2ec;
}

.controls-inner {
  max-width: 1800px;
  margin: 0 auto;
  padding: 24px 40px 18px;
}

.search-row {
  display: flex;
  align-items: center;
  gap: 12px;
}

.search-box {
  width: min(500px, 100%);
  height: 46px;
  padding: 0 16px;
  border: 1px solid #cbd3df;
  border-radius: 9px;
  background: #fff;
  font-family: inherit;
  font-size: 15px;
  outline: none;
}

.search-box:focus {
  border-color: #315ec8;
  box-shadow:
    0 0 0 3px
    rgba(49,94,200,.12);
}

.clear-button {
  height: 46px;
  padding: 0 18px;
  border: 1px solid #cbd3df;
  border-radius: 9px;
  background: #fff;
  font-family: inherit;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
}

.clear-button:hover {
  background: #f4f6fa;
}

.count {
  margin-left: 4px;
  color: #647086;
  font-size: 14px;
}


/* ============================================================
   カテゴリボタン
============================================================ */

.category-row {
  display: flex;
  flex-wrap: wrap;
  gap: 9px;
  margin-top: 20px;
  padding-top: 18px;
  border-top: 1px solid #e3e7ee;
}

.category-button {
  padding: 9px 17px;
  border: 0;
  border-radius: 999px;
  background: #e9eefc;
  color: #234b9c;
  font-family: inherit;
  font-size: 14px;
  cursor: pointer;
}

.category-button:hover {
  background: #dce6ff;
}

.category-button.active {
  background: #173f96;
  color: #fff;
}


/* ============================================================
   メイン
============================================================ */

main {
  max-width: 1800px;
  margin: 0 auto;
  padding: 24px 40px 60px;
}


/* ============================================================
   カテゴリ
============================================================ */

.category-section {
  margin-bottom: 36px;
}

.category-heading {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 0 0 14px;
  padding-bottom: 10px;
  border-bottom: 2px solid #d6deeb;
}

.category-title {
  margin: 0;
  color: #111827;
  font-size: 24px;
  font-weight: 700;
}

.category-count {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 38px;
  height: 27px;
  padding: 0 10px;
  border-radius: 999px;
  background: #e8eefc;
  color: #173f96;
  font-size: 13px;
  font-weight: 700;
}


/* ============================================================
   ギャラリー
============================================================ */

.gallery-grid {
  display: grid;
  grid-template-columns:
    repeat(
      auto-fill,
      minmax(260px, 1fr)
    );
  gap: 18px;
}


/* ============================================================
   カード
============================================================ */

.card {
  display: flex;
  flex-direction: column;
  min-width: 0;
  padding: 0;
  overflow: hidden;
  border: 1px solid #d9e0ea;
  border-radius: 13px;
  background: #fff;
  box-shadow:
    0 2px 8px
    rgba(20,35,70,.06);
  font-family: inherit;
  text-align: left;
  cursor: pointer;
  transition:
    transform .15s ease,
    box-shadow .15s ease;
}

.card:hover {
  transform: translateY(-2px);
  box-shadow:
    0 7px 20px
    rgba(20,35,70,.12);
}

.image-area {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 310px;
  padding: 12px;
  background: #fff;
}

.image-area img {
  display: block;
  max-width: 100%;
  max-height: 100%;
  width: auto;
  height: auto;
  object-fit: contain;
}

.card-title {
  min-height: 58px;
  padding: 14px 15px 16px;
  border-top: 1px solid #edf0f5;
  color: #111827;
  font-size: 16px;
  line-height: 1.45;
  font-weight: 700;
  overflow-wrap: anywhere;
}

.empty {
  padding: 50px 10px;
  color: #667085;
  font-size: 15px;
  text-align: center;
}


/* ============================================================
   高機能画像ビューア
============================================================ */

.modal {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 1000;
  overflow: hidden;
  background: rgba(4,10,28,.93);
  user-select: none;
  -webkit-user-select: none;
}

.modal.open {
  display: block;
}

.viewer-header {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  z-index: 1010;
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 76px;
  padding: 12px 20px;
  background: #0c162d;
}

.viewer-title {
  min-width: 0;
  padding-right: 20px;
  overflow: hidden;
  color: #fff;
  font-size: 18px;
  font-weight: 700;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.viewer-buttons {
  display: flex;
  flex-shrink: 0;
  gap: 9px;
}

.viewer-button {
  min-height: 46px;
  padding: 0 17px;
  border: 1px solid #d7dce5;
  border-radius: 8px;
  background: #fff;
  color: #172033;
  font-family: inherit;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
}

.viewer-button:hover {
  background: #eef3ff;
}

.viewer-stage {
  position: absolute;
  top: 76px;
  right: 0;
  bottom: 0;
  left: 0;
  overflow: hidden;
  cursor: grab;

  /*
    iPhone / iPadで重要。
    Safari標準のスクロール・拡大処理ではなく
    このビューア側でタッチ操作を処理する。
  */
  touch-action: none;
  -ms-touch-action: none;
  overscroll-behavior: none;
}

.viewer-stage.dragging {
  cursor: grabbing;
}

.modal-image {
  position: absolute;
  top: 50%;
  left: 50%;
  display: block;
  max-width: none;
  max-height: none;
  width: auto;
  height: auto;
  transform-origin: center center;
  will-change: transform;
  pointer-events: none;

  -webkit-user-drag: none;
  -webkit-touch-callout: none;
  user-select: none;
}

.viewer-help {
  position: absolute;
  bottom: 12px;
  left: 12px;
  z-index: 1010;
  padding: 9px 13px;
  border: 1px solid rgba(255,255,255,.35);
  border-radius: 6px;
  background: rgba(8,18,39,.86);
  color: #fff;
  font-size: 12px;
  line-height: 1.4;
  pointer-events: none;
}


/* ============================================================
   スマートフォン
============================================================ */

@media (max-width: 800px) {

  .viewer-header {
    min-height: 64px;
    padding: 8px 8px;
  }

  .viewer-title {
    display: none;
  }

  .viewer-buttons {
    width: 100%;
    justify-content: center;
    gap: 4px;
  }

  .viewer-button {
    min-height: 40px;
    padding: 0 9px;
    font-size: 12px;
  }

  .viewer-stage {
    top: 64px;
  }

  .viewer-help {
    bottom: 8px;
    left: 50%;
    width: max-content;
    max-width: calc(100% - 20px);
    transform: translateX(-50%);
    text-align: center;
    font-size: 11px;
  }

}


@media (max-width: 700px) {

  .hero {
    padding: 22px 16px;
  }

  .hero h1 {
    font-size: 25px;
  }

  .hero p {
    font-size: 13px;
  }

  .controls-inner {
    padding: 16px;
  }

  .search-row {
    flex-wrap: wrap;
  }

  .search-box {
    flex: 1 1 100%;
    width: 100%;
  }

  .count {
    margin-left: 0;
  }

  main {
    padding:
      18px 12px
      40px;
  }

  .category-title {
    font-size: 20px;
  }

  .gallery-grid {
    grid-template-columns:
      repeat(
        2,
        minmax(0,1fr)
      );
    gap: 10px;
  }

  .image-area {
    height: 230px;
    padding: 7px;
  }

  .card-title {
    min-height: 50px;
    padding: 10px;
    font-size: 13px;
  }

}


@media (max-width: 430px) {

  .gallery-grid {
    grid-template-columns:
      repeat(
        2,
        minmax(0,1fr)
      );
  }

  .image-area {
    height: 200px;
  }

  .viewer-button {
    padding: 0 7px;
    font-size: 11px;
  }

}

</style>

</head>


<body>


<header class="hero">

  <div class="hero-inner">

    <h1>
      便利機能の紹介ページ
    </h1>

    <p>
      画像はクリックで大きく表示できます。
      カテゴリやタイトルから目的の画像を検索できます。
    </p>

  </div>

</header>


<section class="controls">

  <div class="controls-inner">

    <div class="search-row">

      <input
        id="searchBox"
        class="search-box"
        type="search"
        placeholder="タイトル・カテゴリで検索"
      >

      <button
        id="clearButton"
        class="clear-button"
        type="button"
      >
        検索クリア
      </button>

      <div
        id="displayCount"
        class="count"
      ></div>

    </div>


    <div
      id="categoryButtons"
      class="category-row"
    ></div>

  </div>

</section>


<main id="gallery"></main>


<div
  id="modal"
  class="modal"
>

  <div class="viewer-header">

    <div
      id="viewerTitle"
      class="viewer-title"
    ></div>

    <div class="viewer-buttons">

      <button
        id="zoomOutButton"
        class="viewer-button"
        type="button"
      >
        縮小
      </button>

      <button
        id="zoomInButton"
        class="viewer-button"
        type="button"
      >
        拡大
      </button>

      <button
        id="fitButton"
        class="viewer-button"
        type="button"
      >
        全体表示
      </button>

      <button
        id="newTabButton"
        class="viewer-button"
        type="button"
      >
        別タブ
      </button>

      <button
        id="modalClose"
        class="viewer-button"
        type="button"
      >
        閉じる
      </button>

    </div>

  </div>


  <div
    id="viewerStage"
    class="viewer-stage"
  >

    <img
      id="modalImage"
      class="modal-image"
      alt=""
      draggable="false"
    >

  </div>


  <div
    id="viewerHelp"
    class="viewer-help"
  >
    PC：ホイールで拡大縮小 / ドラッグで移動 /
    iPhone：1本指で移動 / 2本指で拡大縮小 /
    Esc：閉じる
  </div>

</div>


<script>

let galleryData = [];

let selectedCategory =
  'すべて';


const gallery =
  document.getElementById(
    'gallery'
  );

const searchBox =
  document.getElementById(
    'searchBox'
  );

const clearButton =
  document.getElementById(
    'clearButton'
  );

const categoryButtons =
  document.getElementById(
    'categoryButtons'
  );

const displayCount =
  document.getElementById(
    'displayCount'
  );

const modal =
  document.getElementById(
    'modal'
  );

const modalImage =
  document.getElementById(
    'modalImage'
  );

const modalClose =
  document.getElementById(
    'modalClose'
  );

const viewerStage =
  document.getElementById(
    'viewerStage'
  );

const viewerTitle =
  document.getElementById(
    'viewerTitle'
  );

const zoomInButton =
  document.getElementById(
    'zoomInButton'
  );

const zoomOutButton =
  document.getElementById(
    'zoomOutButton'
  );

const fitButton =
  document.getElementById(
    'fitButton'
  );

const newTabButton =
  document.getElementById(
    'newTabButton'
  );


// ============================================================
// ビューア状態
// ============================================================

let viewerScale = 1;

let viewerX = 0;
let viewerY = 0;

let currentImagePath = '';


// PCドラッグ
let mouseDragging = false;

let mouseStartX = 0;
let mouseStartY = 0;

let mouseImageStartX = 0;
let mouseImageStartY = 0;


// iPhone / iPad
let touchDragging = false;

let touchStartX = 0;
let touchStartY = 0;

let touchImageStartX = 0;
let touchImageStartY = 0;


// ピンチ
let pinchActive = false;

let pinchStartDistance = 0;
let pinchStartScale = 1;

let pinchStartViewerX = 0;
let pinchStartViewerY = 0;

let pinchStartCenterX = 0;
let pinchStartCenterY = 0;


// ============================================================
// カテゴリ
// ============================================================

function getCategories() {

  return [
    ...new Set(
      galleryData.map(
        item =>
          item.category
      )
    )
  ];

}


function getCategoryCount(
  category
) {

  return galleryData.filter(
    item =>
      item.category ===
      category
  ).length;

}


function renderCategoryButtons() {

  const categories =
    getCategories();

  categoryButtons.innerHTML =
    '';

  categoryButtons.appendChild(
    createCategoryButton(
      'すべて',
      galleryData.length
    )
  );

  categories.forEach(
    category => {

      categoryButtons.appendChild(
        createCategoryButton(
          category,
          getCategoryCount(
            category
          )
        )
      );

    }
  );

}


function createCategoryButton(
  category,
  count
) {

  const button =
    document.createElement(
      'button'
    );

  button.type =
    'button';

  button.className =
    'category-button';

  if (
    selectedCategory ===
    category
  ) {

    button.classList.add(
      'active'
    );

  }

  button.textContent =
    category +
    '（' +
    count +
    '）';

  button.onclick =
    function() {

      selectedCategory =
        category;

      renderCategoryButtons();

      renderGallery();

    };

  return button;
}


// ============================================================
// 絞り込み
// ============================================================

function getFilteredItems() {

  const keyword =
    searchBox.value
      .trim()
      .toLowerCase();

  return galleryData.filter(
    item => {

      const categoryOK =
        selectedCategory ===
        'すべて' ||
        item.category ===
        selectedCategory;

      const keywordOK =
        !keyword ||
        item.name
          .toLowerCase()
          .includes(
            keyword
          ) ||
        item.category
          .toLowerCase()
          .includes(
            keyword
          );

      return (
        categoryOK &&
        keywordOK
      );

    }
  );

}


// ============================================================
// ギャラリー描画
// ============================================================

function renderGallery() {

  const filtered =
    getFilteredItems();

  displayCount.textContent =
    '表示数：' +
    filtered.length +
    ' / ' +
    galleryData.length;

  gallery.innerHTML =
    '';

  if (
    filtered.length === 0
  ) {

    const empty =
      document.createElement(
        'div'
      );

    empty.className =
      'empty';

    empty.textContent =
      '該当する画像がありません。';

    gallery.appendChild(
      empty
    );

    return;

  }


  let categories;

  if (
    selectedCategory ===
    'すべて'
  ) {

    categories =
      getCategories().filter(
        category =>
          filtered.some(
            item =>
              item.category ===
              category
          )
      );

  } else {

    categories = [
      selectedCategory
    ];

  }


  categories.forEach(
    category => {

      const items =
        filtered.filter(
          item =>
            item.category ===
            category
        );

      if (
        items.length === 0
      ) {
        return;
      }


      const section =
        document.createElement(
          'section'
        );

      section.className =
        'category-section';


      const heading =
        document.createElement(
          'div'
        );

      heading.className =
        'category-heading';


      const title =
        document.createElement(
          'h2'
        );

      title.className =
        'category-title';

      title.textContent =
        category;


      const count =
        document.createElement(
          'span'
        );

      count.className =
        'category-count';

      count.textContent =
        items.length +
        '件';


      heading.appendChild(
        title
      );

      heading.appendChild(
        count
      );


      const grid =
        document.createElement(
          'div'
        );

      grid.className =
        'gallery-grid';


      items.forEach(
        item => {

          grid.appendChild(
            createCard(
              item
            )
          );

        }
      );


      section.appendChild(
        heading
      );

      section.appendChild(
        grid
      );

      gallery.appendChild(
        section
      );

    }
  );

}


// ============================================================
// カード
// ============================================================

function createCard(
  item
) {

  const card =
    document.createElement(
      'button'
    );

  card.type =
    'button';

  card.className =
    'card';


  const imageArea =
    document.createElement(
      'div'
    );

  imageArea.className =
    'image-area';


  const image =
    document.createElement(
      'img'
    );

  image.src =
    item.path;

  image.alt =
    item.name;

  image.loading =
    'lazy';


  const title =
    document.createElement(
      'div'
    );

  title.className =
    'card-title';

  title.textContent =
    item.name;


  imageArea.appendChild(
    image
  );

  card.appendChild(
    imageArea
  );

  card.appendChild(
    title
  );


  card.onclick =
    function() {

      currentImagePath =
        item.path;

      viewerTitle.textContent =
        item.name;

      modalImage.alt =
        item.name;


      modal.classList.add(
        'open'
      );


      document.body.style.overflow =
        'hidden';


      modalImage.onload =
        function() {

          fitImage();

        };


      modalImage.src =
        item.path;

    };


  return card;
}


// ============================================================
// ビューア変形
// ============================================================

function applyViewerTransform() {

  modalImage.style.transform =
    'translate(-50%, -50%) ' +
    'translate(' +
    viewerX +
    'px,' +
    viewerY +
    'px) ' +
    'scale(' +
    viewerScale +
    ')';

}


// ============================================================
// 全体表示
// ============================================================

function fitImage() {

  if (
    !modalImage.naturalWidth ||
    !modalImage.naturalHeight
  ) {
    return;
  }


  const stageWidth =
    viewerStage.clientWidth;

  const stageHeight =
    viewerStage.clientHeight;


  const margin =
    24;


  const availableWidth =
    Math.max(
      1,
      stageWidth -
      margin * 2
    );


  const availableHeight =
    Math.max(
      1,
      stageHeight -
      margin * 2
    );


  viewerScale =
    Math.min(
      availableWidth /
        modalImage.naturalWidth,

      availableHeight /
        modalImage.naturalHeight,

      1
    );


  viewerX =
    0;

  viewerY =
    0;


  modalImage.style.width =
    modalImage.naturalWidth +
    'px';

  modalImage.style.height =
    modalImage.naturalHeight +
    'px';


  applyViewerTransform();

}


// ============================================================
// 拡大縮小
// ============================================================

function changeZoom(
  multiplier,
  clientX,
  clientY
) {

  const oldScale =
    viewerScale;


  let newScale =
    oldScale *
    multiplier;


  newScale =
    Math.max(
      0.05,
      Math.min(
        newScale,
        8
      )
    );


  if (
    Math.abs(
      newScale -
      oldScale
    ) < 0.0001
  ) {
    return;
  }


  const rect =
    viewerStage
      .getBoundingClientRect();


  const pointerX =
    typeof clientX ===
    'number'
      ? clientX -
        rect.left -
        rect.width / 2
      : 0;


  const pointerY =
    typeof clientY ===
    'number'
      ? clientY -
        rect.top -
        rect.height / 2
      : 0;


  const ratio =
    newScale /
    oldScale;


  viewerX =
    pointerX -
    (
      pointerX -
      viewerX
    ) *
    ratio;


  viewerY =
    pointerY -
    (
      pointerY -
      viewerY
    ) *
    ratio;


  viewerScale =
    newScale;


  applyViewerTransform();

}


// ============================================================
// 閉じる
// ============================================================

function closeModal() {

  modal.classList.remove(
    'open'
  );


  modalImage.src =
    '';


  currentImagePath =
    '';


  viewerScale =
    1;

  viewerX =
    0;

  viewerY =
    0;


  mouseDragging =
    false;

  touchDragging =
    false;

  pinchActive =
    false;


  viewerStage.classList.remove(
    'dragging'
  );


  document.body.style.overflow =
    '';

}


// ============================================================
// ボタン
// ============================================================

zoomInButton.onclick =
  function() {

    changeZoom(
      1.25
    );

  };


zoomOutButton.onclick =
  function() {

    changeZoom(
      0.8
    );

  };


fitButton.onclick =
  function() {

    fitImage();

  };


newTabButton.onclick =
  function() {

    if (
      currentImagePath
    ) {

      window.open(
        currentImagePath,
        '_blank',
        'noopener'
      );

    }

  };


modalClose.onclick =
  closeModal;


// ============================================================
// PC：マウスホイール
// ============================================================

viewerStage.addEventListener(
  'wheel',
  function(event) {

    event.preventDefault();


    const multiplier =
      event.deltaY < 0
        ? 1.12
        : 0.89;


    changeZoom(
      multiplier,
      event.clientX,
      event.clientY
    );

  },
  {
    passive: false
  }
);


// ============================================================
// PC：ドラッグ開始
// ============================================================

viewerStage.addEventListener(
  'mousedown',
  function(event) {

    if (
      event.button !== 0
    ) {
      return;
    }


    mouseDragging =
      true;


    mouseStartX =
      event.clientX;

    mouseStartY =
      event.clientY;


    mouseImageStartX =
      viewerX;

    mouseImageStartY =
      viewerY;


    viewerStage.classList.add(
      'dragging'
    );

  }
);


// ============================================================
// PC：ドラッグ中
// ============================================================

window.addEventListener(
  'mousemove',
  function(event) {

    if (
      !mouseDragging
    ) {
      return;
    }


    viewerX =
      mouseImageStartX +
      (
        event.clientX -
        mouseStartX
      );


    viewerY =
      mouseImageStartY +
      (
        event.clientY -
        mouseStartY
      );


    applyViewerTransform();

  }
);


// ============================================================
// PC：ドラッグ終了
// ============================================================

window.addEventListener(
  'mouseup',
  function() {

    mouseDragging =
      false;


    viewerStage.classList.remove(
      'dragging'
    );

  }
);


// ============================================================
// タッチ補助：2点間距離
// ============================================================

function getTouchDistance(
  touch1,
  touch2
) {

  const dx =
    touch2.clientX -
    touch1.clientX;


  const dy =
    touch2.clientY -
    touch1.clientY;


  return Math.sqrt(
    dx * dx +
    dy * dy
  );

}


// ============================================================
// タッチ補助：2本指の中心
// ============================================================

function getTouchCenter(
  touch1,
  touch2
) {

  return {

    x:
      (
        touch1.clientX +
        touch2.clientX
      ) / 2,

    y:
      (
        touch1.clientY +
        touch2.clientY
      ) / 2

  };

}


// ============================================================
// iPhone / iPad：タッチ開始
// ============================================================

viewerStage.addEventListener(
  'touchstart',
  function(event) {

    event.preventDefault();


    // --------------------------------------------------------
    // 1本指
    // --------------------------------------------------------

    if (
      event.touches.length ===
      1
    ) {

      pinchActive =
        false;


      touchDragging =
        true;


      const touch =
        event.touches[0];


      touchStartX =
        touch.clientX;

      touchStartY =
        touch.clientY;


      touchImageStartX =
        viewerX;

      touchImageStartY =
        viewerY;


      viewerStage.classList.add(
        'dragging'
      );

      return;

    }


    // --------------------------------------------------------
    // 2本指
    // --------------------------------------------------------

    if (
      event.touches.length ===
      2
    ) {

      touchDragging =
        false;

      pinchActive =
        true;


      pinchStartDistance =
        getTouchDistance(
          event.touches[0],
          event.touches[1]
        );


      pinchStartScale =
        viewerScale;


      pinchStartViewerX =
        viewerX;

      pinchStartViewerY =
        viewerY;


      const center =
        getTouchCenter(
          event.touches[0],
          event.touches[1]
        );


      const rect =
        viewerStage
          .getBoundingClientRect();


      pinchStartCenterX =
        center.x -
        rect.left -
        rect.width / 2;


      pinchStartCenterY =
        center.y -
        rect.top -
        rect.height / 2;


      viewerStage.classList.add(
        'dragging'
      );

    }

  },
  {
    passive: false
  }
);


// ============================================================
// iPhone / iPad：タッチ移動
// ============================================================

viewerStage.addEventListener(
  'touchmove',
  function(event) {

    event.preventDefault();


    // --------------------------------------------------------
    // 1本指ドラッグ
    // --------------------------------------------------------

    if (
      event.touches.length ===
      1 &&
      touchDragging &&
      !pinchActive
    ) {

      const touch =
        event.touches[0];


      viewerX =
        touchImageStartX +
        (
          touch.clientX -
          touchStartX
        );


      viewerY =
        touchImageStartY +
        (
          touch.clientY -
          touchStartY
        );


      applyViewerTransform();

      return;

    }


    // --------------------------------------------------------
    // 2本指ピンチ
    // --------------------------------------------------------

    if (
      event.touches.length ===
      2 &&
      pinchActive
    ) {

      if (
        pinchStartDistance <= 0
      ) {
        return;
      }


      const distance =
        getTouchDistance(
          event.touches[0],
          event.touches[1]
        );


      let newScale =
        pinchStartScale *
        (
          distance /
          pinchStartDistance
        );


      newScale =
        Math.max(
          0.05,
          Math.min(
            newScale,
            8
          )
        );


      const center =
        getTouchCenter(
          event.touches[0],
          event.touches[1]
        );


      const rect =
        viewerStage
          .getBoundingClientRect();


      const currentCenterX =
        center.x -
        rect.left -
        rect.width / 2;


      const currentCenterY =
        center.y -
        rect.top -
        rect.height / 2;


      const ratio =
        newScale /
        pinchStartScale;


      /*
        ピンチ開始時の指の中心にある画像位置を
        指の中心に維持する。
        さらに2本指を同時に動かした場合は
        画像も一緒に移動する。
      */

      viewerX =
        currentCenterX -
        (
          pinchStartCenterX -
          pinchStartViewerX
        ) *
        ratio;


      viewerY =
        currentCenterY -
        (
          pinchStartCenterY -
          pinchStartViewerY
        ) *
        ratio;


      viewerScale =
        newScale;


      applyViewerTransform();

    }

  },
  {
    passive: false
  }
);


// ============================================================
// iPhone / iPad：指を離した
// ============================================================

viewerStage.addEventListener(
  'touchend',
  function(event) {

    event.preventDefault();


    // --------------------------------------------------------
    // ピンチ後に1本指が残った場合
    // そのまま1本指ドラッグへ移行
    // --------------------------------------------------------

    if (
      event.touches.length ===
      1
    ) {

      pinchActive =
        false;


      touchDragging =
        true;


      const touch =
        event.touches[0];


      touchStartX =
        touch.clientX;

      touchStartY =
        touch.clientY;


      touchImageStartX =
        viewerX;

      touchImageStartY =
        viewerY;


      return;

    }


    // --------------------------------------------------------
    // 全ての指を離した
    // --------------------------------------------------------

    if (
      event.touches.length ===
      0
    ) {

      touchDragging =
        false;

      pinchActive =
        false;


      viewerStage.classList.remove(
        'dragging'
      );

    }

  },
  {
    passive: false
  }
);


// ============================================================
// iPhone / iPad：タッチキャンセル
// ============================================================

viewerStage.addEventListener(
  'touchcancel',
  function(event) {

    if (event.cancelable) {

      event.preventDefault();

    }


    touchDragging =
      false;

    pinchActive =
      false;


    viewerStage.classList.remove(
      'dragging'
    );

  },
  {
    passive: false
  }
);


// ============================================================
// キーボード
// ============================================================

document.addEventListener(
  'keydown',
  function(event) {

    if (
      !modal.classList.contains(
        'open'
      )
    ) {
      return;
    }


    if (
      event.key ===
      'Escape'
    ) {

      closeModal();

      return;

    }


    if (
      event.key === '+' ||
      event.key === '='
    ) {

      changeZoom(
        1.25
      );

    }


    if (
      event.key === '-'
    ) {

      changeZoom(
        0.8
      );

    }

  }
);


// ============================================================
// ウィンドウサイズ変更
// ============================================================

window.addEventListener(
  'resize',
  function() {

    if (
      modal.classList.contains(
        'open'
      )
    ) {

      fitImage();

    }

  }
);


// ============================================================
// 検索
// ============================================================

searchBox.addEventListener(
  'input',
  function() {

    renderGallery();

  }
);


clearButton.onclick =
  function() {

    searchBox.value =
      '';

    selectedCategory =
      'すべて';


    renderCategoryButtons();

    renderGallery();


    searchBox.focus();

  };


// ============================================================
// gallery.json読込
// ============================================================

fetch(
  'gallery.json?t=' +
  Date.now()
)

.then(
  response => {

    if (
      !response.ok
    ) {

      throw new Error(
        'gallery.json読込失敗'
      );

    }


    return response.json();

  }
)

.then(
  data => {

    galleryData =
      data;


    renderCategoryButtons();

    renderGallery();

  }
)

.catch(
  error => {

    console.error(
      error
    );


    gallery.innerHTML =
      '<div class="empty">' +
      '画像一覧を読み込めませんでした。' +
      '</div>';

  }
);

</script>
